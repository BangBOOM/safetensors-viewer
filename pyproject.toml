[project]
name = "safetensors-viewer"
version = "0.2.0"
description = "Inspect Hugging Face safetensors weights without loading tensor data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BangBOOM" }]
keywords = ["safetensors", "huggingface", "model", "inspector", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "rich>=13.7",
    "safetensors>=0.4",
    "typer>=0.12",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/BangBOOM/safetensors-viewer"
Repository = "https://github.com/BangBOOM/safetensors-viewer"
Issues = "https://github.com/BangBOOM/safetensors-viewer/issues"

[project.scripts]
stview = "stview.cli:app"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stview"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using .*starlette.testclient.* is deprecated",
]
